# Lint, unit tests, the Helm chart (lint, rendering suite, kubeconform, against
# the last release), the
# kind smoke test (pushes and pull requests only) and
# the broker-facts suite and the integration suite on both audit stores. Pushes and pull requests test
# against the pinned RabbitMQ image (test/broker/docker-compose.yml, which
# runs it twice: the main test broker and the OAuth 2.0 one). The
# weekly run tests both against the latest rabbitmq:4-management, so a RabbitMQ
# release that changes a fact in docs/rabbitmq-behaviour.md opens an issue.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.20.2
      - name: Install kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz" |
            tar -xz -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: helm lint
        run: helm lint --strict charts/volveran -f test/chart/fixtures/team.yaml
      - name: Chart rendering suite
        run: npm run test:chart
      - name: kubeconform (Kubernetes and CRD catalog schemas)
        run: scripts/validate-chart.sh
      - name: Chart against the last release
        run: npm run test:chart:release

  smoke:
    name: kind smoke test
    # The chart, image and server together; the weekly run is only for broker facts.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KIND_VERSION: v0.33.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.20.2
      - name: Install kind
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/bin/kind" "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64"
          chmod +x "$RUNNER_TEMP/bin/kind"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: npm ci
      # A failed step prints the pods, events and logs (scripts/kind-smoke.mjs).
      - name: Smoke test
        run: npm run test:smoke

  broker:
    name: Broker facts (${{ github.event_name == 'schedule' && 'rabbitmq:4-management latest' || 'pinned RabbitMQ' }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      # Empty means the pinned tag in test/broker/docker-compose.yml.
      VOLVERAN_TEST_RABBITMQ_IMAGE: ${{ github.event_name == 'schedule' && 'rabbitmq:4-management' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: github.event_name == 'schedule'
        run: docker pull rabbitmq:4-management
      - name: Broker-facts suite
        run: npm run test:broker
      - name: Integration suite on SQLite
        id: integration-sqlite
        run: npm run test:integration
      # Runs whatever SQLite's result, so a failure there hides nothing here; either failing fails the job.
      - name: Integration suite on PostgreSQL
        if: ${{ !cancelled() && (steps.integration-sqlite.conclusion == 'success' || steps.integration-sqlite.conclusion == 'failure') }}
        run: npm run test:integration
        env:
          VOLVERAN_TEST_AUDIT_STORE: postgres
      - name: Open an issue when a broker fact stops holding
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(docker run --rm --entrypoint sh rabbitmq:4-management -c 'echo $RABBITMQ_VERSION')
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Broker facts fail on RabbitMQ $version" \
            --body "The weekly broker-facts run against \`rabbitmq:4-management\` (RabbitMQ $version) failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. A fact in docs/rabbitmq-behaviour.md may no longer hold."
