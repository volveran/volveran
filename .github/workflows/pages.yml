# Publishes the landing page in site/, with docs/images, and the demo at /demo/
# to GitHub Pages. The demo is the web app of the latest release tag, built with
# the demo page, simulator and banner of main (scripts/demo.mjs). A release
# republishes the demo by dispatching this workflow on main once the GitHub
# Release is out (release.yml, job pages): the github-pages environment deploys
# from main only, so a run on the tag would be refused. Before anything is
# uploaded, the demo check (npm run demo:check) must pass.
name: Pages

on:
  push:
    branches: [main]
    # What the build reads from main: the site, its images and the demo's
    # recording, the server and shared modules and the scenario the demo
    # imports, the build and check scripts (the Vite config is in demo.mjs)
    # and the dependencies they run with.
    paths:
      - 'site/**'
      - 'docs/images/**'
      - 'docs/demo/**'
      - 'src/server/**'
      - 'src/shared/**'
      - 'scripts/demo*.mjs'
      - 'scripts/release-tag.mjs'
      - 'scripts/screenshots/messages.mjs'
      - 'tsconfig.demo.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          mkdir _site
          cp -r site/. _site/
          rm -rf _site/demo
          cp -r docs/images _site/images
      # Finds the latest release tag on origin and fetches it (the checkout has no tags).
      - run: node scripts/demo.mjs build _site/demo
      - uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        id: firefox
      # The demo's guard: every route of the tag's openapi.json is handled or
      # listed as not in the demo, and a smoke run in headless Firefox walks the
      # banner's suggested path (scripts/demo-check.mjs). A failure ends the job
      # here, before the upload: the landing page and the demo stay as published.
      - run: npm run demo:check -- _site/demo
        env:
          FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deploy
