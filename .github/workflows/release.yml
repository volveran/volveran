# Publishes the Docker image and the Helm chart when a version tag is pushed
# (`git tag v0.2.0`), and signs both with keyless cosign.
#
# Version check: the tag must be `v<version>` for the version in package.json,
# and the chart's `version` and `appVersion` (charts/volveran/Chart.yaml) must
# be that same version (scripts/check-release-version.mjs). The check, lint,
# unit tests, chart checks and security scans run before anything is pushed. A pre-release tag
# (v0.2.0-rc.1) needs package.json and Chart.yaml at 0.2.0-rc.1 too; it
# publishes a pre-release chart version, which Flux `semver` ranges skip unless
# they ask for pre-releases (e.g. `>=0.2.0-0`).
#
# Image: built for linux/amd64 and linux/arm64 and pushed to
# ghcr.io/volveran/volveran as `<version>` (e.g. 0.2.0) and, unless the tag is
# a pre-release, as `latest`. BuildKit attaches an SBOM and SLSA provenance to
# the image, and a GitHub artifact attestation is pushed next to it; check it with
#   gh attestation verify oci://ghcr.io/volveran/volveran:<version> --owner volveran
#
# Chart: packaged and pushed to oci://ghcr.io/volveran/charts/volveran as
# `<version>`; fetch it with
#   helm pull oci://ghcr.io/volveran/charts/volveran --version <version>
#
# Signatures: the chart and the image are signed by digest with keyless cosign,
# using this workflow's GitHub OIDC identity (no keys to manage). The signing
# certificate's identity is
#   issuer:  https://token.actions.githubusercontent.com
#   subject: https://github.com/volveran/volveran/.github/workflows/release.yml@refs/tags/<tag>
# Verify both with
#   cosign verify ghcr.io/volveran/charts/volveran:<version> \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github\.com/volveran/volveran/\.github/workflows/release\.yml@refs/tags/v.*$'
#   cosign verify ghcr.io/volveran/volveran:<version> \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github\.com/volveran/volveran/\.github/workflows/release\.yml@refs/tags/v.*$'
# A Flux OCIRepository matches the same identity (`issuer` and `subject` are
# regular expressions):
#   spec:
#     url: oci://ghcr.io/volveran/charts/volveran
#     verify:
#       provider: cosign
#       matchOIDCIdentity:
#         - issuer: '^https://token\.actions\.githubusercontent\.com$'
#           subject: '^https://github\.com/volveran/volveran/\.github/workflows/release\.yml@refs/tags/v.*$'
#
# Signature format: cosign is pinned to v2.6, which stores a signature in the
# classic `sha256-<digest>.sig` tag next to the artifact. Every Flux release
# with cosign verification reads that format. cosign v3 (the cosign-installer
# default) writes Sigstore bundles as OCI referrers instead, which Flux reads
# only from source-controller v1.8.0 (Flux v2.8.0, February 2026) on. Move to
# v3 once older Flux releases no longer matter.
# GitHub Release: published last, with the version's CHANGELOG.md entry as its
# notes and the JSON Schema of the profiles file attached; a pre-release tag gets
# a Release marked as a pre-release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/volveran/volveran
  CHART_REPOSITORY: ghcr.io/volveran/charts
  HELM_VERSION: v3.20.2
  COSIGN_VERSION: v2.6.5
  CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
  CERTIFICATE_IDENTITY_REGEXP: '^https://github\.com/volveran/volveran/\.github/workflows/release\.yml@refs/tags/v.*$'

jobs:
  check:
    name: Version check, lint, unit tests, chart checks and security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: ${{ env.HELM_VERSION }}
      - run: npm ci
      - name: Tag matches package.json and Chart.yaml
        run: node scripts/check-release-version.mjs "$GITHUB_REF_NAME"
      - run: npm run lint
      - run: npm test
      # Here rather than in the chart job, so a broken chart stops the release
      # before the image is pushed.
      - name: helm lint
        run: helm lint --strict charts/volveran -f test/chart/fixtures/team.yaml
      - name: Chart rendering suite
        run: npm run test:chart
      # The same checks as security.yml, so a known high finding stops the
      # release before the image is pushed.
      - run: npm audit --audit-level=high
      - run: npm audit --prefix tools/lint --audit-level=high
      - run: docker build -t volveran:scan .
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: volveran:scan
          fail-build: true
          severity-cutoff: high
          config: .grype.yaml
          output-format: table

  image:
    name: Build and push the image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          # latest=auto: `latest` only for tags without a pre-release part.
          flavor: latest=auto
          tags: type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=Volverán
            org.opencontainers.image.description=Self-hosted dead-letter triage for RabbitMQ
            org.opencontainers.image.licenses=Apache-2.0
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  chart:
    name: Push the chart, sign the chart and the image
    # After the image: the chart's default image tag (its appVersion) must exist.
    needs: [check, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless cosign signs with this job's GitHub OIDC token.
      id-token: write
    env:
      IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      # cosign uses the Docker credentials, helm its own registry config.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: helm registry login
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Package and push the chart
        id: push
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package charts/volveran --destination "$RUNNER_TEMP/chart"
          # helm push prints `Pushed: <ref>` and `Digest: sha256:...` on stderr.
          helm push "$RUNNER_TEMP/chart/volveran-$version.tgz" "oci://$CHART_REPOSITORY" 2>&1 | tee "$RUNNER_TEMP/push.log"
          digest=$(sed -n 's/^Digest: \(sha256:[0-9a-f]\{64\}\)$/\1/p' "$RUNNER_TEMP/push.log")
          if [ -z "$digest" ]; then
            echo "::error::No digest in the helm push output"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign the chart and the image
        env:
          CHART_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$CHART_REPOSITORY/volveran@$CHART_DIGEST"
          cosign sign --yes "$IMAGE@$IMAGE_DIGEST"
      # The check a GitOps maintainer runs (see the header), by tag, so a
      # signature that does not verify with the documented identity fails the release.
      - name: Verify both signatures
        run: |
          version="${GITHUB_REF_NAME#v}"
          for ref in "$CHART_REPOSITORY/volveran:$version" "$IMAGE:$version"; do
            cosign verify "$ref" \
              --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" \
              --certificate-identity-regexp "$CERTIFICATE_IDENTITY_REGEXP" > /dev/null
            echo "Verified $ref"
          done

  github-release:
    name: Publish the GitHub Release
    # Last: the Release points readers at an image and a chart that must exist.
    needs: chart
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Publish the changelog entry as the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            /^## \[/ || /^\[[^]]+\]: / { found = 0 }
            found
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::No entry for $version in CHANGELOG.md"
            exit 1
          fi
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Volverán $version" \
            --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}" profiles.schema.json
