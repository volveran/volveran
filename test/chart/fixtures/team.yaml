# The smallest values a real install needs: the OIDC settings, the Secret
# holding the OIDC client and session secrets, one Broker Profile and the
# Secret holding its password. Tests layer their own values on top.
oidc:
  issuer: https://login.example.com/realms/ops
  clientId: volveran
  redirectUrl: https://volveran.example.com/auth/callback
  existingSecret: volveran-oidc

brokerProfiles:
  passwordsSecret: volveran-broker-passwords
  profiles:
    - name: prod
      managementUrl: https://rabbit.example.com:15671
      amqpUrl: amqps://rabbit.example.com:5671
      username: volveran
      passwordEnv: VOLVERAN_PROD_PASSWORD
      vhosts: ["/"]
      defaultQueueFilter: "*.dlq"
      protected: true
