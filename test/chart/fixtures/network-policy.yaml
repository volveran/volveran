# team.yaml plus a NetworkPolicy with ingress peers and egress rules, so
# scripts/validate-chart.sh checks the NetworkPolicy against the API schema.
oidc:
  issuer: https://login.example.com/realms/ops
  clientId: volveran
  redirectUrl: https://volveran.example.com/auth/callback
  existingSecret: volveran-oidc

brokerProfiles:
  passwordsSecret: volveran-broker-passwords
  profiles:
    - name: prod
      managementUrl: https://rabbit.example.com:15671
      amqpUrl: amqps://rabbit.example.com:5671
      username: volveran
      passwordEnv: VOLVERAN_PROD_PASSWORD
      vhosts: ["/"]
      defaultQueueFilter: "*.dlq"
      protected: true

networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gateway-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: envoy
  egress:
    - to:
        - ipBlock:
            cidr: 10.20.0.0/24
      ports:
        - port: 15671
          protocol: TCP
        - port: 5671
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 203.0.113.10/32
      ports:
        - port: 443
          protocol: TCP
