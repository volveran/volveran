---
# Source: volveran/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: volveran-profiles
  labels:
    app.kubernetes.io/name: volveran
    app.kubernetes.io/instance: volveran
    app.kubernetes.io/version: "<version>"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: volveran-<version>
data:
  profiles.yaml: |
    profiles:
    - amqpUrl: amqps://rabbit.example.com:5671
      defaultQueueFilter: '*.dlq'
      managementUrl: https://rabbit.example.com:15671
      name: prod
      passwordEnv: VOLVERAN_PROD_PASSWORD
      protected: true
      username: volveran
      vhosts:
      - /
    version: 1
---
# Source: volveran/templates/pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: volveran-data
  labels:
    app.kubernetes.io/name: volveran
    app.kubernetes.io/instance: volveran
    app.kubernetes.io/version: "<version>"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: volveran-<version>
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
