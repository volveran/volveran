---
# Source: volveran/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: volveran
  labels:
    app.kubernetes.io/name: volveran
    app.kubernetes.io/instance: volveran
    app.kubernetes.io/version: "<version>"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: volveran-<version>
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: volveran
      app.kubernetes.io/instance: volveran
  template:
    metadata:
      labels:
        app.kubernetes.io/name: volveran
        app.kubernetes.io/instance: volveran
      annotations:
        # A change to the chart-managed Broker Profiles rolls the pod.
        checksum/broker-profiles: 5384ec2dbdb9fb26b5ed049c599969e873cadaa4b36938b9f9b31de79d3ee591
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      # Restricted Pod Security Standard. 1000:1000 is the image's numeric user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: volveran
          image: ghcr.io/volveran/volveran:<version>
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Volverán listens only once OIDC discovery has succeeded, so the
          # startup probe allows 5 minutes (5s x 60) before liveness takes over.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # /readyz never checks a broker: one broker outage must not take the UI away.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          env:
            - name: VOLVERAN_AUTH
              value: oidc
            - name: VOLVERAN_HOST
              value: 0.0.0.0
            - name: VOLVERAN_PORT
              value: "8080"
            - name: VOLVERAN_PROFILES_FILE
              value: /config/profiles.yaml
            - name: VOLVERAN_DATA_DIR
              value: /data
            - name: VOLVERAN_OIDC_ISSUER
              value: "https://login.example.com/realms/ops"
            - name: VOLVERAN_OIDC_CLIENT_ID
              value: "volveran"
            - name: VOLVERAN_OIDC_REDIRECT_URL
              value: "https://volveran.example.com/auth/callback"
            - name: VOLVERAN_OIDC_SCOPES
              value: "openid email profile"
            - name: VOLVERAN_OIDC_GROUPS_CLAIM
              value: "groups"
            # Credentials come only from Secrets the platform engineer names.
            - name: VOLVERAN_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: "volveran-oidc"
                  key: "client-secret"
            - name: VOLVERAN_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: "volveran-oidc"
                  key: "session-secret"
          envFrom:
            # Each key becomes a variable named by some profile's passwordEnv.
            - secretRef:
                name: "volveran-broker-passwords"
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: broker-profiles
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: volveran-data
        - name: broker-profiles
          configMap:
            name: volveran-profiles
        # The root filesystem is read-only; /tmp is the only scratch space.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
