profiles:
  - name: fixture
    managementUrl: http://localhost:15672
    amqpUrl: amqp://localhost:5672
    username: volveran-admin
    passwordEnv: VOLVERAN_FIXTURE_PASSWORD
    vhosts: all
    defaultQueueFilter: "*.dlq"
    protected: false
    roles:
      admin:
        - fixture-admins
    replayRate:
      default: 100
      max: 100
    canary:
      watchWindow: 30s
    replayRules:
      - name: fixture-paused
        vhost: /
        queue: payments.dlq
        filter:
          kind: header
          name: transient
        every: 24h
        backoff:
          initial: 10m
          max: 1h
        maxAttempts: 5
        stopWhen:
          diedAgain: 5
          within: 15m
      - name: fixture-running
        vhost: /
        queue: payments.dlq
        filter:
          kind: header
          name: transient
        every: 24h
        backoff:
          initial: 10m
          max: 1h
        maxAttempts: 5
        stopWhen:
          diedAgain: 5
          within: 15m
