# Second test broker: RabbitMQ with the OAuth 2.0 backend only, for the
# OAuth 2.0 broker facts (docs/rabbitmq-behaviour.md, "OAuth 2.0 tokens").
# There are no internal users: every connection presents an access token
# from the mock OIDC provider as its password.

loopback_users = none
auth_backends.1 = rabbit_auth_backend_oauth2

# Tokens must carry this audience, and scopes prefixed with it
# (`rabbitmq.configure:*/*`, `rabbitmq.tag:management`, ...).
auth_oauth2.resource_server_id = rabbitmq

# The mock provider's signing key, pinned in oidc.json. RabbitMQ refuses to
# start with an http `jwks_url` ("Key Server URL must be https"), and the mock
# provider serves http only. No issuer is configured: the mock provider's
# issuer follows the Host header, so tokens fetched from the host say
# http://127.0.0.1:<port>/default, and the broker does not check `iss`.
auth_oauth2.signing_keys.default = /etc/rabbitmq/oidc-signing-key.pem
auth_oauth2.default_key = default
