# Volverán test broker. See README "Development".

# Topology and users are loaded at boot (origin queues, DLQs, DLX wiring).
load_definitions = /etc/rabbitmq/definitions.json

# Users connect from the host through published ports, not loopback.
loopback_users = none

# 15 s global consumer timeout: short enough that tests of a timeout that is
# not overridden (classic queues never time out; the management API shows
# this value) finish quickly. Tests that need a quorum consumer timed out set
# a shorter x-consumer-timeout themselves. Keep everything else that holds
# Messages well under 15 s.
consumer_timeout = 15000

# Management statistics keep RabbitMQ's default 5 s collection interval, so
# the suite sees the same lag a production broker has (see
# docs/rabbitmq-behaviour.md, "Queue counts"). Count Messages with a passive
# queue.declare instead.
