# The Flux Kustomization that applies the app/ directory and decrypts its SOPS
# secrets with the age key in the `sops-age` Secret of flux-system (see
# ../README.md). Put this file in the directory `flux bootstrap` syncs for your
# cluster, and point `path` at where you copied app/.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: volveran
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/volveran
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
