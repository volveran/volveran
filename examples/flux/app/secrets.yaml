# A TEMPLATE, not a secret: fill in the values, then encrypt this file with your
# own age key before committing it (see ../README.md):
#   sops --encrypt --in-place secrets.yaml
# Never commit it unencrypted. The chart only references these Secrets by name.
apiVersion: v1
kind: Secret
metadata:
  name: volveran-oidc
  namespace: volveran
type: Opaque
stringData:
  # The OIDC client's secret, from your provider.
  client-secret: "<OIDC client secret>"
  # At least 32 random characters; it signs the session cookies:
  #   openssl rand -base64 48
  session-secret: "<at least 32 random characters>"
---
apiVersion: v1
kind: Secret
metadata:
  name: volveran-broker-passwords
  namespace: volveran
type: Opaque
stringData:
  # One key per Broker Profile passwordEnv in helmrelease.yaml.
  VOLVERAN_PROD_PASSWORD: "<prod broker password>"
  VOLVERAN_STAGING_PASSWORD: "<staging broker password>"
