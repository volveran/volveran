# Installs the chart from the OCIRepository with the values below. Every value
# is documented in charts/volveran/README.md; replace each example.com name with
# your own. Secrets are never values: the chart reads them from the Secrets in
# secrets.yaml (encrypted with SOPS, see ../README.md).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volveran
  namespace: volveran
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: volveran
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    oidc:
      issuer: https://login.example.com/realms/ops
      clientId: volveran
      # Register this exact URL with the OIDC client. Its host is the route's host.
      redirectUrl: https://volveran.example.com/auth/callback
      existingSecret: volveran-oidc

    brokerProfiles:
      # Its keys become environment variables: one per profile's passwordEnv.
      passwordsSecret: volveran-broker-passwords
      profiles:
        - name: prod
          managementUrl: https://rabbit.example.com:15671
          amqpUrl: amqps://rabbit.example.com:5671
          username: volveran
          passwordEnv: VOLVERAN_PROD_PASSWORD
          vhosts: ["/"]
          defaultQueueFilter: "*.dlq"
          protected: true
        - name: staging
          managementUrl: https://rabbit.staging.example.com:15671
          amqpUrl: amqps://rabbit.staging.example.com:5671
          username: volveran
          passwordEnv: VOLVERAN_STAGING_PASSWORD

    # The audit store: every Audit Entry and every Discarded Message body.
    # Size it above settings.bodyRetentionMaxBytes (1 GiB by default).
    persistence:
      enabled: true
      size: 5Gi

    httpRoute:
      enabled: true
      parentRefs:
        # An existing Gateway with an https listener. A Gateway in another
        # namespace must allow routes from this one (allowedRoutes).
        - name: edge
          namespace: gateways
          sectionName: https
      hostnames: [volveran.example.com]
