# Where Flux fetches the chart: the OCI artifact the release workflow pushes to
# ghcr.io. Flux only accepts an artifact signed with keyless cosign by
# Volverán's release workflow (.github/workflows/release.yml) for a version tag;
# `issuer` and `subject` are regular expressions.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: volveran
  namespace: volveran
spec:
  interval: 1h
  url: oci://ghcr.io/volveran/charts/volveran
  ref:
    # Patch releases of 1.0 are picked up on their own. Pre-releases
    # (1.0.0-rc.1) are skipped, so until 1.0.0 is out this range finds nothing;
    # a range like ">=1.0.0-0" asks for them.
    semver: "1.0.x"
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: '^https://token\.actions\.githubusercontent\.com$'
        subject: '^https://github\.com/volveran/volveran/\.github/workflows/release\.yml@refs/tags/v.*$'
