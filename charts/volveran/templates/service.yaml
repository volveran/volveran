{{- /* The stable in-cluster address of the Volverán pod, for routes and port-forwarding. */ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "volveran.fullname" . }}
  labels:
    {{- include "volveran.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "volveran.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
