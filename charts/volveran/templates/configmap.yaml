{{- /*
The Broker Profiles file, rendered from brokerProfiles.profiles and mounted at
/config/profiles.yaml. Not rendered when brokerProfiles.existingConfigMap names
a ConfigMap the platform engineer manages.
*/ -}}
{{- if not .Values.brokerProfiles.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "volveran.profilesConfigMapName" . }}
  labels:
    {{- include "volveran.labels" . | nindent 4 }}
data:
  profiles.yaml: |
    {{- include "volveran.profilesYaml" . | nindent 4 }}
{{- end }}
