{{- /*
The audit store volume (Audit Entries and Discarded Message bodies). Helm keeps
it on uninstall, so deleting a release never deletes the audit trail.
*/ -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "volveran.dataClaimName" . }}
  labels:
    {{- include "volveran.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
