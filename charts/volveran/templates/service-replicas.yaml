{{- /*
The headless Service of the internal port, with several Replicas: it names the
Replicas' pods in the cluster's DNS, for an engineer looking at them, and no route
references it. A Replica finds another by the address in the audit store, not here.
*/ -}}
{{- if gt (int .Values.replicaCount) 1 }}
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-replicas" (include "volveran.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "volveran.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "volveran.selectorLabels" . | nindent 4 }}
  ports:
    - name: forwarding
      port: {{ .Values.forwarding.port }}
      targetPort: forwarding
      protocol: TCP
{{- end }}
