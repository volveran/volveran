{{- /*
The Volverán pods, always in Team Mode. The audit store is SQLite on the data
volume, or, with postgres.existingSecret, PostgreSQL, and then there is no volume.
One Replica uses Recreate. Several, on PostgreSQL only, use a rolling update that
keeps every pod serving until its replacement is ready, and reach each other on an
internal port at the pod's own address (ADR 0014).
*/ -}}
{{- $several := gt (int .Values.replicaCount) 1 }}
{{- include "volveran.validate" . }}
{{- include "volveran.validateOptions" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "volveran.fullname" . }}
  labels:
    {{- include "volveran.labels" . | nindent 4 }}
spec:
  replicas: {{ int .Values.replicaCount }}
  strategy:
    {{- if $several }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- else }}
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "volveran.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "volveran.selectorLabels" . | nindent 8 }}
        {{- with .Values.pod.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or (not .Values.brokerProfiles.existingConfigMap) .Values.pod.annotations }}
      annotations:
        {{- if not .Values.brokerProfiles.existingConfigMap }}
        # A change to the chart-managed Broker Profiles rolls the pod.
        checksum/broker-profiles: {{ include "volveran.profilesYaml" . | sha256sum }}
        {{- end }}
        {{- with .Values.pod.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.pod.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.pod.terminationGracePeriodSeconds }}
      {{- with .Values.pod.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.pod.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pod.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pod.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.pod.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.pod.topologySpreadConstraints | nindent 8 }}
      {{- else if $several }}
      # ScheduleAnyway: a small cluster still runs every Replica, less safely.
      topologySpreadConstraints:
        {{- range list "kubernetes.io/hostname" "topology.kubernetes.io/zone" }}
        - maxSkew: 1
          topologyKey: {{ . }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "volveran.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
      # Restricted Pod Security Standard. 1000:1000 is the image's numeric user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: volveran
          image: {{ include "volveran.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
            {{- if $several }}
            - name: forwarding
              containerPort: {{ .Values.forwarding.port }}
              protocol: TCP
            {{- end }}
          # Volverán listens only once OIDC discovery has succeeded, so the
          # startup probe allows 5 minutes (5s x 60) before liveness takes over.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # /readyz never checks a broker: one broker outage must not take the UI away.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          env:
            - name: VOLVERAN_AUTH
              value: oidc
            - name: VOLVERAN_HOST
              value: 0.0.0.0
            - name: VOLVERAN_PORT
              value: "8080"
            - name: VOLVERAN_PROFILES_FILE
              value: /config/profiles.yaml
            {{- if .Values.postgres.existingSecret }}
            # The URL can hold a password, so it comes only from a Secret.
            - name: VOLVERAN_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | quote }}
                  key: {{ .Values.postgres.urlKey | quote }}
            {{- if .Values.postgres.requireTls }}
            - name: VOLVERAN_POSTGRES_REQUIRE_TLS
              value: "true"
            {{- end }}
            {{- with .Values.postgres.ca.bundle }}
            - name: VOLVERAN_POSTGRES_CA_FILE
              value: {{ printf "%s/%s/%s" (include "volveran.caBundlesDir" $) . $.Values.postgres.ca.key | quote }}
            {{- end }}
            {{- else }}
            - name: VOLVERAN_DATA_DIR
              value: /data
            {{- end }}
            - name: VOLVERAN_OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: VOLVERAN_OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: VOLVERAN_OIDC_REDIRECT_URL
              value: {{ .Values.oidc.redirectUrl | quote }}
            - name: VOLVERAN_OIDC_SCOPES
              value: {{ .Values.oidc.scopes | quote }}
            - name: VOLVERAN_OIDC_GROUPS_CLAIM
              value: {{ .Values.oidc.groupsClaim | quote }}
            # Credentials come only from Secrets the platform engineer names.
            - name: VOLVERAN_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.existingSecret | quote }}
                  key: {{ .Values.oidc.clientSecretKey | quote }}
            - name: VOLVERAN_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.existingSecret | quote }}
                  key: {{ .Values.oidc.sessionSecretKey | quote }}
            {{- if .Values.postgres.existingSecret }}
            - name: VOLVERAN_SESSION_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.existingSecret | quote }}
                  key: {{ .Values.oidc.sessionEncryptionKeyKey | quote }}
            {{- end }}
            {{- if $several }}
            # Replicas forward requests to a Checkout's owner at its pod address, under this secret.
            - name: VOLVERAN_FORWARDING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.forwarding.existingSecret | quote }}
                  key: {{ .Values.forwarding.secretKey | quote }}
            - name: VOLVERAN_FORWARDING_PORT
              value: {{ printf "%d" (int64 .Values.forwarding.port) | quote }}
            - name: VOLVERAN_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VOLVERAN_FORWARDING_ADDRESS
              value: {{ printf "$(VOLVERAN_POD_IP):%d" (int64 .Values.forwarding.port) | quote }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: VOLVERAN_METRICS_PORT
              value: {{ printf "%d" (int64 .Values.metrics.port) | quote }}
            {{- end }}
            {{- with include "volveran.settingsEnv" . | trim }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with .Values.caBundles.oidcTrust.bundle }}
            # Node.js adds this file to its trusted CAs, so OIDC discovery and the
            # token exchange can reach an issuer signed by a private CA.
            - name: NODE_EXTRA_CA_CERTS
              value: {{ printf "%s/%s/%s" (include "volveran.caBundlesDir" $) . $.Values.caBundles.oidcTrust.key | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.brokerProfiles.passwordsSecret .Values.alerts.existingSecret }}
          envFrom:
            {{- with .Values.brokerProfiles.passwordsSecret }}
            # Each key becomes a variable named by some profile's passwordEnv.
            - secretRef:
                name: {{ . | quote }}
            {{- end }}
            {{- with .Values.alerts.existingSecret }}
            # Each key becomes a variable named by some Alert Destination's urlEnv or signingSecretEnv.
            - secretRef:
                name: {{ . | quote }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.pod.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: broker-profiles
              mountPath: /config
              readOnly: true
            {{- if not .Values.postgres.existingSecret }}
            - name: data
              mountPath: /data
            {{- end }}
            {{- range .Values.caBundles.bundles }}
            - name: ca-{{ .name }}
              mountPath: {{ printf "%s/%s" (include "volveran.caBundlesDir" $) .name }}
              readOnly: true
            {{- end }}
      volumes:
        {{- if not .Values.postgres.existingSecret }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "volveran.dataClaimName" . }}
          {{- else }}
          # persistence.enabled is false: the audit store is lost on every restart.
          emptyDir: {}
          {{- end }}
        {{- end }}
        - name: broker-profiles
          configMap:
            name: {{ include "volveran.profilesConfigMapName" . }}
        {{- range .Values.caBundles.bundles }}
        - name: ca-{{ .name }}
          {{- if .configMap }}
          configMap:
            name: {{ .configMap | quote }}
          {{- else }}
          secret:
            secretName: {{ .secret | quote }}
          {{- end }}
        {{- end }}
        # The root filesystem is read-only; /tmp is the only scratch space.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
