# Values for the volveran chart. Every value is documented in README.md.
# The chart always runs Team Mode (OIDC sign-in), one replica, Recreate.

# -- Must be 1. Volverán runs exactly one replica (docs/adr/0003-single-replica-on-kubernetes.md).
replicaCount: 1

image:
  repository: ghcr.io/volveran/volveran
  # -- Defaults to the chart's appVersion.
  tag: ""
  # -- sha256:<64 hex>. Pins the image by digest and overrides tag.
  digest: ""
  pullPolicy: IfNotPresent
  # -- Names of existing Secrets (kubernetes.io/dockerconfigjson) for a private registry.
  pullSecrets: []

# OIDC sign-in (Team Mode). issuer, clientId, redirectUrl and existingSecret are required.
oidc:
  # issuer: https://login.example.com/realms/ops
  # clientId: volveran
  # -- The public callback URL the OIDC client registers; its path ends in /auth/callback.
  # redirectUrl: https://volveran.example.com/auth/callback
  scopes: openid email profile
  # -- The claim holding the Operator's groups (a name or dotted path, e.g. realm_access.roles), which Broker Profile roles map.
  groupsClaim: groups
  # -- An existing Secret holding the OIDC client secret and the session secret.
  # existingSecret: volveran-oidc
  clientSecretKey: client-secret
  # -- At least 32 characters; it signs the session cookies.
  sessionSecretKey: session-secret
  # -- With postgres.existingSecret: at least 32 characters, not the session secret; it encrypts the tokens of sessions in the database.
  sessionEncryptionKeyKey: session-encryption-key

brokerProfiles:
  # -- Broker Profiles, in the same shape as the profiles YAML (see profiles.example.yaml).
  # Rendered to a chart-managed ConfigMap. Required unless existingConfigMap is set.
  profiles: []
  # -- Alert Destinations, in the same shape as the profiles YAML (see profiles.example.yaml):
  # name, type (slack, teams or webhook), urlEnv, and signingSecretEnv on a webhook. URLs and
  # secrets never go here: the variables they name are keys of alerts.existingSecret.
  alertDestinations: []
  # -- An existing ConfigMap with a profiles.yaml key, used instead of profiles.
  # Its caFile paths point under /etc/volveran/ca (see caBundles).
  existingConfigMap: ""
  # -- An existing Secret whose keys become environment variables. Each profile's
  # passwordEnv names one of its keys.
  passwordsSecret: ""

# Alerts.
alerts:
  # -- An existing Secret whose keys become environment variables: the destination
  # URLs and signing secrets named by brokerProfiles.alertDestinations.
  existingSecret: ""

# Private CAs. Each bundle (an existing ConfigMap or Secret) is mounted read-only
# at /etc/volveran/ca/<name>/, one file per key. A Broker Profile trusts one with
# caFile: /etc/volveran/ca/<name>/<key>.
caBundles:
  bundles: []
  #  - name: broker-ca
  #    configMap: rabbit-internal-ca   # or secret: rabbit-internal-ca
  # -- The bundle file the OIDC provider's certificate chains to, set as
  # NODE_EXTRA_CA_CERTS. Empty bundle trusts only the public CAs.
  oidcTrust:
    bundle: ""
    key: ca.crt

# The audit store on PostgreSQL instead of SQLite (see docs/postgresql.md). Leave
# existingSecret empty to stay on SQLite. It needs a database and a user that exist.
postgres:
  # -- An existing Secret holding the connection URL (postgres://user:password@postgres.example.com:5432/database).
  existingSecret: ""
  urlKey: url
  # -- Refuses a connection without TLS and a certificate that does not verify.
  requireTls: true
  # -- The CA of the server's certificate, when it is private: one of caBundles.bundles and its key.
  ca:
    bundle: ""
    key: ca.crt

# The audit store on SQLite (Audit Entries, Discarded Message bodies and depth history).
# Not used with postgres.existingSecret. See "Sizing the audit store" in README.md.
persistence:
  # -- false uses an emptyDir: the audit trail is lost on every restart.
  enabled: true
  # -- An existing PersistentVolumeClaim to use instead of a chart-created one.
  existingClaim: ""
  size: 1Gi
  # -- Empty uses the cluster's default StorageClass.
  storageClass: ""
  accessMode: ReadWriteOnce

service:
  port: 8080

# Prometheus metrics, on a port of their own that no route references. They need
# no session, so with a NetworkPolicy admit only the scraper (networkPolicy.metricsFrom).
metrics:
  # -- Sets VOLVERAN_METRICS_PORT and adds the container port and a metrics Service port.
  enabled: false
  port: 9464
  serviceMonitor:
    # -- A Prometheus Operator ServiceMonitor (needs its CRDs). Requires metrics.enabled.
    enabled: false
    # -- Added to the ServiceMonitor's labels, to match your Prometheus's serviceMonitorSelector.
    labels: {}
    # -- For example 30s. Empty uses your Prometheus's scrape_interval.
    interval: ""
    # -- For example 10s, at most interval. Empty uses your Prometheus's scrape_timeout.
    scrapeTimeout: ""

# Volverán's own settings, each mapped to its VOLVERAN_* variable. null leaves
# the variable unset, so Volverán's own default (in the comment) applies.
settings:
  # -- VOLVERAN_CHECKOUT_MAX_MESSAGES (1-65535). Default 1000.
  checkoutMaxMessages: null
  # -- VOLVERAN_CHECKOUT_MAX_MB (1-1000000). Default 100. Raise pod.resources memory with it.
  checkoutMaxMb: null
  # -- VOLVERAN_CHECKOUT_TIME_LIMIT_MINUTES (1-1440). Default 30.
  checkoutTimeLimitMinutes: null
  # -- VOLVERAN_CHECKOUT_HEARTBEAT_SECONDS (10-3600). Default 120.
  checkoutHeartbeatSeconds: null
  # -- VOLVERAN_BODY_RETENTION_DAYS (1-36500). Default 30.
  bodyRetentionDays: null
  # -- VOLVERAN_BODY_RETENTION_MAX_BYTES: bytes, or with KiB, MiB, GiB or TiB (e.g. 1GiB). Default 1GiB.
  bodyRetentionMaxBytes: null
  # -- VOLVERAN_BODY_RETENTION_INTERVAL_MINUTES (1-1440). Default 60.
  bodyRetentionIntervalMinutes: null
  # -- VOLVERAN_HISTORY_INTERVAL_SECONDS (15-3600): how often dead-letter queues are sampled. Default 60.
  historyIntervalSeconds: null
  # -- VOLVERAN_HISTORY_RETENTION_DAYS (1-90): how long Samples are kept. Default 14.
  historyRetentionDays: null

# -- Extra container environment variables (name with value or valueFrom), for
# settings the chart does not name yet. Variables the chart sets are refused.
extraEnv: []

# Exposure. Neither route is rendered by default (port-forward only); both may be
# enabled at once, for example during a migration. Volverán is served at the root
# of each host: its session cookies are scoped to / and /auth, so a route cannot
# mount it under a path prefix. Sign-in works only at the host of oidc.redirectUrl.
httpRoute:
  # -- A Gateway API HTTPRoute (gateway.networking.k8s.io/v1) attached to an existing Gateway.
  enabled: false
  # -- The Gateway(s) to attach to: name, and optionally namespace, sectionName, port.
  # - name: edge
  #   namespace: gateways
  #   sectionName: https
  parentRefs: []
  # -- For example volveran.example.com. At least one is required.
  hostnames: []
  annotations: {}

ingress:
  # -- A networking.k8s.io/v1 Ingress for a classic ingress controller.
  enabled: false
  # -- Empty uses the cluster's default IngressClass.
  className: ""
  # -- For example volveran.example.com. At least one is required.
  hosts: []
  # -- TLS Secrets that already exist (the chart renders no Certificate).
  # - secretName: volveran-tls
  #   hosts: [volveran.example.com]
  tls: []
  annotations: {}

pod:
  # -- Time for SIGTERM to end every active Checkout before SIGKILL.
  terminationGracePeriodSeconds: 60
  # -- Sized for the default Checkout limit (100 MB of held Message bodies).
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # -- Volverán never talks to the Kubernetes API.
  automountServiceAccountToken: false
  # Scheduling, and extra labels and annotations on the pod.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  # -- Added to the pod's labels; the chart's selector labels cannot be overridden.
  labels: {}
  annotations: {}

# An optional NetworkPolicy for the Volverán pod. See "Network policy" in README.md.
networkPolicy:
  enabled: false
  # -- NetworkPolicy peers (namespaceSelector, podSelector, ipBlock) admitted to the http port,
  # for example the Gateway or ingress controller. Empty admits nothing but the pod's node.
  ingressFrom: []
  # -- NetworkPolicy peers admitted to the metrics port only, for example your Prometheus's
  # pods, when metrics.enabled. They gain no access to the http port. Empty admits nobody.
  metricsFrom: []
  # -- NetworkPolicy egress rules (to, ports), for example the brokers and the OIDC provider.
  # Empty leaves egress open; any rule restricts egress to these rules plus DNS (dnsTo).
  egress: []
  # -- The cluster DNS resolver, allowed on port 53 (UDP and TCP) whenever egress is restricted.
  dnsTo:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
